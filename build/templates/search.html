<main class="search-page narrow">
  <div class="page-head">
    <h1>Search the Bible</h1>
    <form class="search-form" role="search">
      <input id="q" type="search" placeholder="Search for a word or phrase, or type a reference like John 3:16" aria-label="Search" autocomplete="off">
    </form>
    <p class="search-status" aria-live="polite"></p>
  </div>
  <ol class="results"></ol>
</main>
